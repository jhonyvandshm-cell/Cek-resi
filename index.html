<!DOCTYPE html>
<html>
<head>
<style>
body, html { margin:0; padding:0; font-family: sans-serif; }
.toolbar { display:flex; gap:8px; padding:10px; background:#f2f2f2; align-items:center; }
select, input { padding:8px; font-size:14px; }
select { flex:0 0 auto; }
input { flex:1; min-width:0; }
button { padding:8px 12px; background:#d40000; color:white; border:none; border-radius:4px; }
iframe { width:100%; height:calc(100vh - 56px); border:none; display:block; }
.info { padding:10px; font-size:13px; color:#666; }
</style>
</head>
<body>
<div class="toolbar">
<select id="kurir" onchange="gantiKurir()">
<option value="https://www.jet.co.id/track" data-embed="1">J&T</option>
<option value="https://jne.co.id/tracking-package" data-embed="1">JNE</option>
<option value="https://www.sicepat.com/checkAwb" data-embed="0">SiCepat</option>
</select>
<input type="text" id="resi" placeholder="Nomor resi">
<button onclick="copyResi()">Copy</button>
</div>
<iframe id="frame" src="https://www.jet.co.id/track"></iframe>
<div id="info" class="info" style="display:none;"></div>
<script>
function gantiKurir() {
  var opt = document.getElementById("kurir");
  var url = opt.value;
  var embed = opt.options[opt.selectedIndex].getAttribute("data-embed");
  var frame = document.getElementById("frame");
  var info = document.getElementById("info");
  if (embed === "1") {
    frame.style.display = "block";
    info.style.display = "none";
    frame.src = url;
  } else {
    frame.style.display = "none";
    info.style.display = "block";
    info.innerHTML = "Kurir ini tidak bisa ditampilkan di dalam halaman. <a href='" + url + "' target='_blank'>Buka di tab baru</a>";
  }
}
function copyResi() {
  var resi = document.getElementById("resi").value.trim();
  if (!resi) return;
  navigator.clipboard.writeText(resi);
}
</script>
</body>
</html>
